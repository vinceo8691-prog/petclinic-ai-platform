name: API smoke tests (Newman)

# Starts the REST API and runs the Postman collection against it. Runs on every pull request, after
# a merge to main, and on demand. No path filter, see backend-ci.yml.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: newman-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  newman-tests:
    name: API smoke tests (Newman)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: spring-petclinic-rest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
          cache-dependency-path: spring-petclinic-rest/pom.xml

      - name: Start PetClinic API
        run: nohup ./mvnw -B spring-boot:run > api.log 2>&1 &

      - name: Wait for API availability
        run: |
          # The first start compiles the project and generates sources, so allow a few minutes.
          timeout=240
          while ! curl -s http://localhost:9966/petclinic > /dev/null; do
            echo "Waiting for API..."
            sleep 1
            timeout=$((timeout - 1))
            if [ "$timeout" -le 0 ]; then
              echo "API not available within the timeout."
              tail -n 50 api.log
              exit 1
            fi
          done
          echo "API available!"

      - name: Run Newman tests
        run: bash postman-tests.sh

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: newman-html-reports
          path: spring-petclinic-rest/src/test/postman/reports/

      - name: Upload API log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: api-log
          path: spring-petclinic-rest/api.log
